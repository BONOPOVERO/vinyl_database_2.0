<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Catalogazione Vinili - Mobile Experience</title>
  
  <!-- PWA Manifest & Theme Color -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5227ff">
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Sfondo LightPillar (Fullscreen) -->
  <div id="light-pillar-container" class="light-pillar-container"></div>

  <!-- HEADER PRINCIPALE & BARRA STRUMENTI -->
  <header class="app-header">
    <div class="top-nav-row">
      <!-- Bottone Cerca -->
      <button id="toggle-search-btn" class="icon-circle-btn" aria-label="Cerca Vinili" title="Cerca Vinili">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>

      <!-- Bottone Filtri & Categorie -->
      <button id="open-filter-btn" class="action-pill-btn filter-btn-pill" aria-label="Filtri e Categorie">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
        <span>Filtri</span>
      </button>

      <!-- Bottone Statistiche -->
      <button id="open-stats-btn" class="icon-circle-btn" aria-label="Statistiche Collezione" title="Statistiche Collezione">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
      </button>

      <!-- Toggle Audio Suono Vinile -->
      <button id="toggle-audio-btn" class="icon-circle-btn" aria-label="Attiva Audio Vinile" title="Attiva Audio Vinile (Crepitio)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
      </button>

      <!-- Pulsante Installa PWA App -->
      <button id="install-pwa-btn" class="icon-circle-btn hidden" aria-label="Installa App" title="Installa App sulla Home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      </button>

      <!-- Counter & Navigazione Veloce -->
      <div class="nav-cluster">
        <button id="prev-album-btn" class="nav-arrow-btn" aria-label="Precedente">&lt;</button>
        <span id="mobile-album-counter" class="mobile-album-counter">1 / 1</span>
        <button id="next-album-btn" class="nav-arrow-btn" aria-label="Successivo">&gt;</button>
      </div>

      <!-- Toggle Lista Mobile -->
      <button id="toggle-list-btn" class="toggle-list-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        <span>Titoli</span>
      </button>
    </div>

    <!-- CAMPO DI RICERCA LIVE -->
    <div id="search-bar-wrapper" class="search-bar-wrapper hidden">
      <input type="text" id="search-input" placeholder="Cerca artista, album, genere, etichetta..." autocomplete="off">
      <button id="clear-search-btn" class="clear-input-btn">&times;</button>
    </div>
  </header>

  <!-- RIQUADRO VETRO LIQUIDO CENTRALE -->
  <main id="my-liquid-glass" class="center-glass-panel">
    <div class="glass-surface__content">
      <article id="center-content" class="center-content">
        <!-- Generato dinamicamente via JS -->
      </article>
    </div>
  </main>

  <!-- MODAL FILTRI & CATEGORIE & ORDINAMENTO -->
  <div id="filter-modal" class="app-modal" aria-hidden="true">
    <div class="modal-content glass-card">
      <div class="modal-header">
        <h3>Filtri, Categorie & Ordinamento</h3>
        <button id="close-filter-modal" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        
        <!-- CATEGORIE -->
        <div class="form-group">
          <label>Categoria Catalogo</label>
          <div class="modal-category-chips">
            <button type="button" class="chip-btn active" data-category="ALL">Tutti</button>
            <button type="button" class="chip-btn" data-category="Personale">Personale</button>
            <button type="button" class="chip-btn" data-category="Wishlist">Wish List</button>
            <button type="button" class="chip-btn" data-category="Eredità">Eredità</button>
          </div>
        </div>

        <!-- ORDINAMENTO -->
        <div class="form-group">
          <label>Ordinamento Catalogo</label>
          <select id="sort-select">
            <option value="DEFAULT">Ordinamento Predefinito (Iniziale)</option>
            <option value="YEAR_ASC">Anno Uscita (Dal più antico)</option>
            <option value="YEAR_DESC">Anno Uscita (Dal più recente)</option>
            <option value="ARTIST_ASC">Artista (A - Z)</option>
            <option value="ALBUM_ASC">Titolo Album (A - Z)</option>
            <option value="RATING_DESC">Stato Disco Migliore (10 -> 1)</option>
          </select>
        </div>

        <!-- INTERVALLO ANNI -->
        <div class="form-group">
          <label>Anno di Uscita</label>
          <div class="input-range-row">
            <input type="number" id="filter-year-from" placeholder="Da es. 1970">
            <span>fino a</span>
            <input type="number" id="filter-year-to" placeholder="A es. 1990">
          </div>
        </div>

        <!-- GENERE -->
        <div class="form-group">
          <label>Genere Musicale</label>
          <select id="filter-genre-select">
            <option value="">Tutti i Generi</option>
          </select>
        </div>

        <!-- BACKUP / ESPORTAZIONE & IMPORTAZIONE -->
        <div class="form-group" style="margin-top: 10px;">
          <label>Backup & Gestione Database</label>
          <div class="input-range-row">
            <button type="button" id="export-json-btn" class="btn-secondary full-width">📥 Esporta JSON</button>
            <button type="button" id="export-csv-btn" class="btn-secondary full-width">📊 Esporta CSV</button>
          </div>
          <div style="margin-top: 8px;">
            <input type="file" id="import-json-file" accept=".json" class="hidden-file-input">
            <button type="button" id="trigger-import-btn" class="btn-secondary full-width">📤 Importa Backup JSON</button>
          </div>
        </div>

      </div>
      <div class="modal-footer">
        <button id="reset-filters-btn" class="btn-secondary">Reset Filtri</button>
        <button id="apply-filters-btn" class="btn-primary">Applica Filtri</button>
      </div>
    </div>
  </div>

  <!-- MODAL STATISTICHE COLLEZIONE -->
  <div id="stats-modal" class="app-modal" aria-hidden="true">
    <div class="modal-content glass-card large-modal">
      <div class="modal-header">
        <h3>📊 Statistiche della Collezione</h3>
        <button id="close-stats-modal" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" id="stats-modal-body">
        <!-- Generato dinamicamente via JS -->
      </div>
    </div>
  </div>

  <!-- MODAL AGGIUNGI / SCANSIONA VINILE (CON DISCOGS LOOKUP) -->
  <div id="add-vinyl-modal" class="app-modal" aria-hidden="true">
    <div class="modal-content glass-card large-modal">
      <div class="modal-header">
        <h3>📸 Scansiona / Aggiungi Vinile</h3>
        <button id="close-add-modal" class="modal-close-btn">&times;</button>
      </div>
      <form id="add-vinyl-form" class="modal-body scrollable-form">
        
        <!-- SEARCH & BARCODE SCANNER BOX -->
        <div class="discogs-search-box">
          <label style="font-size: 0.82rem; font-weight: 700; color: #ff9ffc;">🔍 Cerca o Scansiona Codice a Barre / Titolo</label>
          <div class="input-range-row">
            <input type="text" id="discogs-query" placeholder="Inserisci Codice a Barre (EAN) o Titolo Album">
            <button type="button" id="discogs-search-btn" class="btn-primary">Cerca Dati</button>
          </div>
          <button type="button" id="start-barcode-scan-btn" class="btn-secondary full-width" style="margin-top: 6px; background: rgba(255, 159, 252, 0.15); border-color: rgba(255, 159, 252, 0.4); font-weight: 700;">
            📷 Scansiona Codice a Barre con la Fotocamera
          </button>
          <div id="discogs-results" class="discogs-results-list hidden"></div>
        </div>

        <!-- FOTO / CAMERASCANNER -->
        <div class="scan-photo-box">
          <div id="photo-preview-container" class="photo-preview-container">
            <div class="scan-placeholder">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
              <span>Scatta Foto o Carica Copertina</span>
            </div>
            <img id="photo-preview-img" src="" class="hidden" alt="Anteprima Foto Vinile">
          </div>
          <input type="file" id="camera-file-input" accept="image/*" capture="environment" class="hidden-file-input">
          <button type="button" id="trigger-camera-btn" class="btn-secondary full-width">📷 Apri Fotocamera / Galleria Foto</button>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>Titolo Album *</label>
            <input type="text" id="add-titolo" required placeholder="Es. Abbey Road">
          </div>
          <div class="form-group">
            <label>Artista *</label>
            <input type="text" id="add-artista" required placeholder="Es. The Beatles">
          </div>
          <div class="form-group">
            <label>Genere</label>
            <input type="text" id="add-genere" placeholder="Es. Rock / Pop">
          </div>
          <div class="form-group">
            <label>Stato Catalogo</label>
            <select id="add-stato-catalogo">
              <option value="Personale">Personale</option>
              <option value="Wishlist">Wish List</option>
              <option value="Eredità">Eredità</option>
            </select>
          </div>
          <div class="form-group">
            <label>Valore Stimato / Prezzo (€)</label>
            <input type="number" id="add-valore-stimato" placeholder="Es. 25" min="0" step="0.5">
          </div>
          <div class="form-group">
            <label>Anno Uscita Originale</label>
            <input type="number" id="add-anno-uscita" placeholder="Es. 1969">
          </div>
          <div class="form-group">
            <label>Anno Stampa</label>
            <input type="number" id="add-anno-stampa" placeholder="Es. 1978">
          </div>
          <div class="form-group">
            <label>Etichetta</label>
            <input type="text" id="add-etichetta" placeholder="Es. Apple Records">
          </div>
          <div class="form-group">
            <label>Numero Catalogo</label>
            <input type="text" id="add-cat-num" placeholder="Es. PCS 7088">
          </div>
          <div class="form-group">
            <label>Codice Matrice / Barcode</label>
            <input type="text" id="add-matrice" placeholder="Es. YEX 749-2">
          </div>
          <div class="form-group">
            <label>Velocità & Grammatura</label>
            <div class="input-range-row">
              <input type="text" id="add-velocita" placeholder="33 / 45 giri" value="33">
              <input type="text" id="add-grammatura" placeholder="Es. 180g" value="180g">
            </div>
          </div>
          <div class="form-group">
            <label>Valutazione Disco (1-10)</label>
            <input type="number" id="add-stato-disco" min="1" max="10" value="8">
          </div>
          <div class="form-group">
            <label>Valutazione Copertina (1-10)</label>
            <input type="number" id="add-stato-copertina" min="1" max="10" value="8">
          </div>
        </div>

        <div class="form-group">
          <label>Note / Dettagli Stato</label>
          <textarea id="add-note" rows="2" placeholder="Note su stato vinile, bollini, codice a barre..."></textarea>
        </div>

        <div class="modal-footer">
          <button type="submit" class="btn-primary full-width">Salva Vinile nel Database</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Lightbox Foto Album -->
  <div id="photo-modal" class="photo-modal" aria-hidden="true">
    <button id="close-modal-btn" class="close-modal-btn">&times;</button>
    <img id="modal-img" src="" alt="Foto Album Ingrandita">
  </div>

  <!-- Ruota di Selezione (Solo Titoli Album) -->
  <aside id="option-wheel" class="wheel-container"></aside>

  <!-- Overlay sfondo -->
  <div id="mobile-overlay" class="mobile-overlay"></div>

  <!-- PULSANTE AGGIUNGI / SCANSIONA VINILE IN BASSO (FLOATING BUTTON) -->
  <button id="open-add-btn" class="fab-bottom-btn" aria-label="Scansiona o Aggiungi Vinile">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
    <span>Scansiona / Aggiungi</span>
  </button>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast-container" class="toast-container"></div>

  <!-- MODAL CAMERASCANNER PER CODICE A BARRE -->
  <div id="barcode-scanner-modal" class="app-modal" aria-hidden="true">
    <div class="modal-content glass-card" style="max-width: 440px;">
      <div class="modal-header">
        <h3>📷 Scansiona Codice a Barre</h3>
        <button id="close-barcode-modal-btn" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" style="align-items: center; text-align: center;">
        <div style="font-size: 0.82rem; color: #ff9ffc; margin-bottom: 8px;">Inquadra il codice a barre (EAN / UPC) sulla custodia del vinile</div>
        <div class="video-scanner-wrapper">
          <video id="barcode-video" autoplay playsinline muted></video>
          <div class="scan-laser-line"></div>
        </div>
        <div id="barcode-status-msg" style="font-size: 0.8rem; color: #cbd5e1; margin-top: 8px;">Fotocamera attiva... inquadra il codice</div>
      </div>
      <div class="modal-footer">
        <button id="cancel-barcode-scan-btn" class="btn-secondary full-width">Annulla Scansione</button>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>

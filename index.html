<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070913">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Collezione Vinili di Lorenzo Bona — Liquid Glass 3D Experience">

  <title>Vinyl Vault — Liquid Glass Experience</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dynamic Ambient Mesh & Refractive Lights -->
  <div class="ambient-background" id="ambientMesh">
    <div class="glow-orb orb-primary"></div>
    <div class="glow-orb orb-secondary"></div>
    <div class="glow-orb orb-tertiary"></div>
    <div class="glass-dust-layer"></div>
  </div>

  <!-- Mobile Overlay for 3D Wheel Drawer -->
  <div id="mobile-overlay" class="mobile-overlay"></div>

  <!-- App Wrapper -->
  <div class="app-viewport">

    <!-- Top Glass Header & Search -->
    <header class="glass-header">
      <div class="header-brand">
        <div class="brand-disc-icon">
          <div class="disc-spindle"></div>
        </div>
        <div class="brand-text">
          <span class="brand-title">VINYL VAULT</span>
          <span class="brand-subtitle">Lorenzo Bona</span>
        </div>
      </div>

      <div class="header-search-container">
        <div class="glass-search-box">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Cerca artista, album, matrice..." autocomplete="off" spellcheck="false">
          <button id="searchClear" class="search-clear-btn" aria-label="Cancella ricerca" style="display: none;">&times;</button>
        </div>
      </div>

      <div class="header-actions">
        <button class="toggle-wheel-btn" id="toggle-wheel-btn" title="Elenco Album 3D">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
          <span class="btn-label">Titoli</span>
        </button>

        <button class="glass-icon-btn" id="openScannerBtn" title="Scansiona Barcode o Matrice">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path>
            <line x1="7" y1="12" x2="17" y2="12"></line>
          </svg>
          <span class="btn-label">Scanner</span>
        </button>
      </div>
    </header>

    <!-- Main Experience: Central Liquid Glass Showcase -->
    <main class="main-experience">
      <div class="liquid-stage-wrapper" id="liquid-stage-wrapper">
        <!-- Rendered dynamically by liquid-carousel.js -->
      </div>
    </main>

    <!-- Overlay scura e sfocata per il cassetto mobile -->
    <div id="mobile-overlay" class="mobile-overlay"></div>

    <!-- Floating 3D Curved Wheel (Desktop & Mobile Drawer) -->
    <aside id="option-wheel" class="wheel-container">
      <!-- Rendered dynamically by liquid-carousel.js -->
    </aside>

    <!-- Floating Liquid Glass Capsule Dock -->
    <nav class="floating-capsule-dock" id="floatingDock">
      <div class="dock-segment categories-segment">
        <button class="dock-pill active" data-category="all">
          <span class="pill-dot"></span> Tutti
        </button>
        <button class="dock-pill" data-category="personal">
          <span class="pill-dot personal-dot"></span> Personale
        </button>
        <button class="dock-pill" data-category="wishlist">
          <span class="pill-dot wishlist-dot"></span> Wishlist
        </button>
        <button class="dock-pill" data-category="family">
          <span class="pill-dot family-dot"></span> Famiglia
        </button>
      </div>

      <div class="dock-separator"></div>

      <div class="dock-segment stats-segment" title="Totale vinili e stima economica">
        <div class="dock-stat-item">
          <span class="stat-num" id="dockTotalCount">0</span>
          <span class="stat-unit">vinili</span>
        </div>
        <div class="dock-stat-item">
          <span class="stat-num stat-val" id="dockTotalValue">€ 0</span>
          <span class="stat-unit">stima</span>
        </div>
      </div>
    </nav>

  </div>

  <!-- Barcode & Matrix Scanner Modal -->
  <dialog class="liquid-glass-modal" id="scannerModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title-group">
          <h3 class="modal-title">Scanner Vinili & Valutazione</h3>
          <span class="modal-subtitle">Riconoscimento Barcode & Ricerca Matrice Runout</span>
        </div>
        <button class="modal-close-btn" id="closeScannerModal" aria-label="Chiudi">&times;</button>
      </div>

      <div class="modal-body">
        <!-- Live Camera Scanner -->
        <div class="scanner-camera-wrapper">
          <video id="scannerVideo" playsinline muted></video>
          <div class="scanner-laser-overlay">
            <div class="laser-beam"></div>
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>
          </div>
          <div class="scanner-hint">Inquadra il codice a barre del vinile</div>
        </div>

        <!-- Manual Search -->
        <div class="scanner-manual-grid">
          <div class="manual-input-box">
            <label for="manualBarcodeVal">Codice a Barre (EAN/UPC)</label>
            <div class="input-with-action">
              <input type="text" id="manualBarcodeVal" placeholder="Es. 075678123425">
              <button id="manualBarcodeBtn" class="glass-btn-primary">Cerca Barcode</button>
            </div>
          </div>

          <div class="manual-input-box">
            <label for="manualMatrixVal">Codice di Matrice (Runout Groove)</label>
            <div class="input-with-action">
              <input type="text" id="manualMatrixVal" placeholder="Es. SD 19129-A / STERLING">
              <button id="manualMatrixBtn" class="glass-btn-primary">Cerca Matrice</button>
            </div>
          </div>
        </div>

        <!-- Result Box -->
        <div class="scanner-result-box" id="scannerResult"></div>
      </div>
    </div>
  </dialog>

  <!-- Module Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="discGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0a10"/>
      <stop offset="60%" stop-color="#141420"/>
      <stop offset="90%" stop-color="#0a0a10"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </radialGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7eb3"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#00dfd8"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="url(#discGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
  <!-- Scanalature Vinile -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  <!-- Etichetta Centrale -->
  <circle cx="256" cy="256" r="90" fill="url(#labelGrad)" stroke="#0a0a10" stroke-width="6"/>
  <!-- Foro Centrale -->
  <circle cx="256" cy="256" r="24" fill="#08070d"/>
</svg>
